[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pretium"
version = "0.5.2"
description = "pretium is now tradefloor. This package re-exports it and warns."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["tradefloor>=0.5.0,<0.6"]

[project.urls]
Homepage = "https://tradefloor.dev"
Repository = "https://github.com/simoncoombes/tradefloor"

[tool.setuptools]
packages = ["pretium"]
