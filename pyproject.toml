[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tradefloor"
version = "0.6.0"
description = "A reproducible evaluation environment for financial AI agents."
readme = "README.md"
requires-python = ">=3.11"
# Dual-licensed, the Rust-ecosystem norm. See LICENSE-APACHE and LICENSE-MIT
# at the repository root, and DECISIONS.md in tradefloor-design for the
# reasoning that superseded an earlier Apache-2.0-only decision.
license = "MIT OR Apache-2.0"
# Declared explicitly, and it has to be. Left to itself maturin finds the
# crate's own copies under rust/, records them in PKG-INFO by basename
# ("License-File: LICENSE-APACHE") but packages them at rust/LICENSE-APACHE.
# PyPI checks the declared path, finds nothing there, and rejects the sdist
# with a 400 while accepting every wheel, because a wheel carries its
# licences in .dist-info by a different mechanism. That asymmetry is why
# 0.1.0 published five wheels and no source distribution.
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE"]
authors = [{ name = "Simon Coombes" }]
keywords = ["simulation", "finance", "market", "orderbook", "deterministic", "backtesting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://tradefloor.dev"
Repository = "https://github.com/simoncoombes/tradefloor"
Documentation = "https://tradefloor.dev"
# PyPI has no changelog field, so a project page can only point at one.
# Without this a visitor has no route from the package to its release notes.
Changelog = "https://github.com/simoncoombes/tradefloor/releases"

[project.optional-dependencies]
# The core package depends on NOTHING. These are for surfaces that genuinely
# need them: the RL environment needs arrays, and the Arrow tables are read
# through whichever dataframe library the consumer already has.
rl = ["numpy>=1.24", "gymnasium>=0.29"]
arrow = ["pyarrow>=14"]
# examples/08-claude-agent.py drives an agent with the Claude API. Optional
# because nothing in the library calls it -- it is one example, and it needs
# an API key and spends money per decision.
claude = ["anthropic>=0.40", "pydantic>=2"]
# The MCP server, which lets an LLM agent drive the simulator over tool calls.
# Optional for the same reason as the rest: nothing in the library imports it,
# and a user who only wants the simulator should not install a server stack.
mcp = ["mcp>=2.0"]
# Runs a real FinRobot agent inside a market, for
# examples/finrobot/rate_shock.py. Optional, and it has to be: this is the
# largest extra by an order of magnitude, and only the LIVE half of the
# integration needs it. Replaying the recorded run -- which is what the
# example and the notebook do by default -- imports none of it.
#
# The pins are not preferences. FinRobot 0.1.5 ships an sdist whose
# `setup.py` reads `requirements.txt` at build time and does not find it, so
# the published wheel declares NO dependencies at all and `pip install
# finrobot` installs a package that cannot import itself. Everything below
# except `finrobot` is that missing list, narrowed to the closure of
# `from finrobot.agents.workflow import SingleAssistant`.
#
# Three of them carry a reason worth knowing:
#
#   pyautogen<0.3   FinRobot's own floor is `pyautogen>=0.2.19`, which today
#                   resolves to 0.10.0 -- the AutoGen 0.4+ rewrite, which does
#                   not provide `import autogen` at all. FinRobot's workflow
#                   module is written against the 0.2 API (ConversableAgent,
#                   UserProxyAgent, autogen.cache.Cache), so the ceiling is
#                   the working version and the floor is FinRobot's.
#   retrievechat    `finrobot.functional.rag` imports
#                   `RetrieveUserProxyAgent` at module scope and
#                   `functional/__init__` imports rag, so the RAG stack is on
#                   the path to `SingleAssistant` whether or not anything
#                   uses it. That is where the size comes from.
#   anthropic<1.0   only for `api_type: "anthropic"`. autogen 0.2.35's
#                   Anthropic client imports `anthropic.types.Completion`,
#                   removed in the 1.0 SDK. An OpenAI-configured run does not
#                   need it; it is here because the shipped example's default
#                   provider is Anthropic.
#
# Python 3.11 exactly: FinRobot declares `>=3.10, <3.12` and this project
# needs >=3.11.
finrobot = [
  "finrobot>=0.1.5",
  "pyautogen[retrievechat]>=0.2.19,<0.11",
  "anthropic>=0.30,<2.0",
  "finnhub-python",
  "yfinance",
  "sec-api",
  "praw",
  "mplfinance",
  "matplotlib",
  "backtrader",
  "reportlab",
  "ipython",
  "pandas",
  "numpy",
  "requests",
]

[project.scripts]
# Reads scenario files: `tradefloor scenario validate scenarios/*.yml`. It
# does not run a market, which is the point -- configuration that can only be
# checked by running a hundred-day simulation is configuration nobody checks.
# `python -m tradefloor ...` is the same command tree without the script.
tradefloor = "tradefloor.__main__:main"
# Speaks MCP over stdio. Point an MCP client at `tradefloor-mcp` with no
# arguments; see tradefloor-docs: docs/mcp.md for a client configuration block.
tradefloor-mcp = "tradefloor.mcp:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
# Mixed layout: the compiled extension is tradefloor._core and the Python package
# in python/ wraps it. Keeps the public name `tradefloor` while leaving room for
# pure-Python surface.
python-source = "python"
module-name = "tradefloor._core"
features = ["python"]
# The stub file and the PEP 561 marker must be INSTALLED, not merely present
# in the source tree. A stub that does not ship types nothing, and the failure
# is silent -- a type checker just falls back to Any.
# The stub, the PEP 561 marker and the SCENARIO PACK must be INSTALLED, not
# merely present in the source tree. A stub that does not ship types nothing,
# and the failure is silent -- a type checker just falls back to Any. The
# scenarios fail more loudly but no more usefully: `Scenario.load("recession")`
# would raise on every pip install while working in a clone, which is the
# worst place for a difference between the two.
include = [
    "python/tradefloor/py.typed",
    "python/tradefloor/_core.pyi",
    "python/tradefloor/scenarios/*.yml",
    # The preset records, for the same reason as the scenarios: the
    # documentation site and anyone citing a preset read the measured panel
    # out of the installed package rather than out of a clone.
    "python/tradefloor/presets/*.json",
]
# `maturin develop` writes the compiled extension and its Windows debug
# database into python/tradefloor/, and maturin then packages everything it
# finds under python-source. So a wheel built on a machine that had ever run
# `maturin develop` carried a second, STALE copy of the extension and a 1.0 MB
# .pdb -- which is how tradefloor 0.5.0 shipped `pretium.pdb` inside every
# wheel. The build artefacts are gitignored, but .gitignore does not reach a
# working tree, and this does. The extension the wheel is supposed to contain
# comes from the Rust build rather than from here, so excluding these patterns
# removes the stowaway and not the payload; tests/test_packaging.py checks that
# on the built artefact rather than trusting it.
exclude = [
  "python/tradefloor/*.pdb",
  "python/tradefloor/*.pyd",
  "python/tradefloor/*.so",
  "python/tradefloor/*.dylib",
]
