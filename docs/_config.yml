title: pretium
description: A market simulator you can run a strategy against. Rust core, Python API.

url: https://simoncoombes.github.io
baseurl: /pretium

# No theme, remote or otherwise. The layout and stylesheet in this directory
# are the whole site, so classic GitHub Pages builds it with no Gemfile and no
# Actions workflow. A build workflow would spend Actions minutes on every push
# to render sixteen markdown files.
defaults:
  - scope:
      path: ""
    values:
      layout: page

# Groups for the ticket rack. Order here is the order they file.
racks:
  - id: start
    label: Getting started
  - id: measure
    label: Measuring
  - id: experiment
    label: Experiments
  - id: connect
    label: Connecting
  - id: reference
    label: Reference

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
