AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  tradefloor hosted trading session server: one ECS Fargate task (ARM64) behind
  an internet-facing ALB with TLS, sessions and accounts on encrypted EFS, the
  key-hash pepper generated into Secrets Manager, logs and the audit stream in
  CloudWatch. NOT DEPLOYED: written for review; deploy only with the owner's
  go-ahead (docs/serve/HOSTED.md).

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI with tag, e.g. 123456789012.dkr.ecr.eu-west-2.amazonaws.com/tradefloor-hosted:0.1.0
  DomainName:
    Type: String
    Description: Public hostname for the API, e.g. api.tradefloor.dev
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 zone for DomainName. Given, the certificate is validated and the alias created here; empty, pass CertificateArn and point DNS yourself.
  CertificateArn:
    Type: String
    Default: ""
    Description: An existing ACM certificate for DomainName (used when HostedZoneId is empty).
  TaskCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]
  TaskMemory:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "3072", "4096"]
  EfsThroughputMode:
    Type: String
    Default: elastic
    AllowedValues: [elastic, bursting]
    Description: elastic bills per GB moved; bursting is free up to a baseline tied to stored size (HOSTED.md, "Cost").
  EnableWaf:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: A WAF web ACL with a per-IP rate rule and AWS managed common rules in front of the ALB.
  WafRateLimitPer5Min:
    Type: Number
    Default: 3000
    MinValue: 100
    Description: Requests per 5 minutes per client IP before WAF blocks (above every plan's own limit).
  AlertEmail:
    Type: String
    Default: ""
    Description: Email for alarms (unhealthy task, 5xx, EFS). Empty for no subscription.
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 180, 365, 400, 731]

Conditions:
  HasZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  UseWaf: !Equals [!Ref EnableWaf, "true"]
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ------------------------------------------------------------- network ----
  # Two public subnets because an ALB needs two AZs. The task runs in one of
  # them with a public IP so it can pull from ECR without a NAT gateway
  # (~$33/month saved); its security group admits only the ALB.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: tradefloor-hosted}]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw}
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetA, RouteTableId: !Ref PublicRoutes}
  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetB, RouteTableId: !Ref PublicRoutes}

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: tradefloor ALB - HTTPS from anywhere, HTTP only to redirect
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: tradefloor task - port 8080 from the ALB only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSg}
  EfsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: tradefloor EFS - NFS from the task only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref TaskSg}

  # ------------------------------------------------------------- storage ----
  # One file system holds accounts.json, usage.json, audit/ and sessions/.
  # Encrypted at rest, TLS in transit, IAM-authorised mounts, and the default
  # AWS Backup plan (daily, 35-day retention).
  Efs:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: !Ref EfsThroughputMode
      BackupPolicy: {Status: ENABLED}
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
        - TransitionToPrimaryStorageClass: AFTER_1_ACCESS
      FileSystemTags: [{Key: Name, Value: tradefloor-hosted}]
  EfsMountA:
    Type: AWS::EFS::MountTarget
    Properties: {FileSystemId: !Ref Efs, SubnetId: !Ref SubnetA, SecurityGroups: [!Ref EfsSg]}
  EfsMountB:
    Type: AWS::EFS::MountTarget
    Properties: {FileSystemId: !Ref Efs, SubnetId: !Ref SubnetB, SecurityGroups: [!Ref EfsSg]}
  EfsAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref Efs
      PosixUser: {Uid: "10001", Gid: "10001"}
      RootDirectory:
        Path: /tradefloor
        CreationInfo: {OwnerUid: "10001", OwnerGid: "10001", Permissions: "0700"}

  # -------------------------------------------------------------- secrets ----
  # Generated here; no person ever sees or types it. The server and the admin
  # CLI (run inside the task via ECS Exec) both read it from the environment.
  PepperSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: tradefloor hosted - pepper mixed into every API key hash. Rotating it invalidates every key.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # ------------------------------------------------------------------ logs ----
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /tradefloor/hosted
      RetentionInDays: !Ref LogRetentionDays
  # The audit stream: the server prints each audit line to stdout as one JSON
  # object. The files on EFS stay the record; this makes refusals searchable
  # (Logs Insights) and alarmable.
  RefusedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.outcome = "unauthorized" }'
      MetricTransformations:
        - {MetricNamespace: tradefloor/hosted, MetricName: UnauthorizedCalls, MetricValue: "1", DefaultValue: 0}

  # ------------------------------------------------------------------- IAM ----
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-pepper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref PepperSecret}
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: efs-and-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
                Resource: !GetAtt Efs.Arn
                Condition:
                  StringEquals: {elasticfilesystem:AccessPointArn: !GetAtt EfsAccessPoint.Arn}
              # ECS Exec, the operator's only way in (no SSH, no admin port).
              - Effect: Allow
                Action: [ssmmessages:CreateControlChannel, ssmmessages:CreateDataChannel,
                         ssmmessages:OpenControlChannel, ssmmessages:OpenDataChannel]
                Resource: "*"

  # ------------------------------------------------------------------- ECS ----
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: tradefloor-hosted
      ClusterSettings: [{Name: containerInsights, Value: disabled}]
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: tradefloor-hosted
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref Efs
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !Ref EfsAccessPoint, IAM: ENABLED}
        - Name: tmp
      ContainerDefinitions:
        - Name: tradefloor
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          User: "10001"
          PortMappings: [{ContainerPort: 8080, Protocol: tcp}]
          Environment:
            - {Name: TRADEFLOOR_HOSTED_DATA, Value: /data}
            - {Name: TRADEFLOOR_HOSTED_TRUST_PROXY, Value: "1"}
          Secrets:
            - {Name: TRADEFLOOR_HOSTED_PEPPER, ValueFrom: !Ref PepperSecret}
          MountPoints:
            - {SourceVolume: data, ContainerPath: /data}
            - {SourceVolume: tmp, ContainerPath: /tmp}
          LinuxParameters: {InitProcessEnabled: true}
          StopTimeout: 30
          HealthCheck:
            Command: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status == 200 else 1)"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: server
  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, EfsMountA, EfsMountB]
    Properties:
      ServiceName: tradefloor-hosted
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      # EXACTLY ONE task, and never two during a deploy: the rate-limit
      # buckets and the session cache are in-process and FileStore allows one
      # writer per session. A deploy therefore has a short gap (HOSTED.md).
      DesiredCount: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSg]
      LoadBalancers:
        - {ContainerName: tradefloor, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup}

  # ------------------------------------------------------------------- ALB ----
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasZone
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: [{DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId}]
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: "120"}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}
        - {Key: routing.http.desync_mitigation_mode, Value: strictest}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "20"}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !If [HasZone, !Ref Certificate, !Ref CertificateArn]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  # Belt and braces: the admin listener is on loopback inside the task and not
  # reachable anyway; nothing under /admin is ever forwarded.
  BlockAdmin:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions: [{Field: path-pattern, PathPatternConfig: {Values: ["/admin", "/admin/*"]}}]
      Actions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: "404", ContentType: application/json,
                                MessageBody: '{"code":"not_found","message":"not found"}'}
  HttpRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: "443", StatusCode: HTTP_301}
  DnsAlias:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: {DNSName: !GetAtt Alb.DNSName, HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID}

  # ------------------------------------------------------------------- WAF ----
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: UseWaf
    Properties:
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: tradefloor-acl}
      Rules:
        - Name: per-ip-rate
          Priority: 0
          Action: {Block: {}}
          Statement:
            RateBasedStatement: {Limit: !Ref WafRateLimitPer5Min, AggregateKeyType: IP}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: per-ip-rate}
        - Name: aws-common
          Priority: 1
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-common}
  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: UseWaf
    Properties: {ResourceArn: !Ref Alb, WebACLArn: !GetAtt WebAcl.Arn}

  # ---------------------------------------------------------------- alarms ----
  AlarmTopic:
    Type: AWS::SNS::Topic
  AlarmEmail:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties: {TopicArn: !Ref AlarmTopic, Protocol: email, Endpoint: !Ref AlertEmail}
  UnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The tradefloor task is not healthy behind the ALB.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - {Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName}
        - {Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName}
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
  ServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The server is answering 5xx (a bug, or the store failing).
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  UnauthorizedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Many failed authentications - key guessing, or a leaked key revoked while a bot still uses it.
      Namespace: tradefloor/hosted
      MetricName: UnauthorizedCalls
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
    Description: Point DomainName here (a CNAME or alias) if HostedZoneId was not given.
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  FileSystemId:
    Value: !Ref Efs
  PepperSecretArn:
    Value: !Ref PepperSecret
