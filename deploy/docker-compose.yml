# The hosted server on one machine, for local runs and rehearsal.
#
#   export TRADEFLOOR_HOSTED_PEPPER=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
#   docker compose -f deploy/docker-compose.yml up --build -d
#   docker compose -f deploy/docker-compose.yml exec tradefloor \
#       python -m tradefloor.serve.hosted.admin create-key me --plan trial
#   curl -H "Authorization: Bearer tfk_..." http://127.0.0.1:8080/v1/usage
#
# The port is published on 127.0.0.1 ONLY. This file is not a way to put the
# server on the internet; that is the AWS path, behind TLS, and needs the
# owner's go-ahead (docs/serve/HOSTED.md).
name: tradefloor-hosted

services:
  tradefloor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tradefloor-hosted:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TRADEFLOOR_HOSTED_DATA: /data
      TRADEFLOOR_HOSTED_PEPPER: ${TRADEFLOOR_HOSTED_PEPPER:?set TRADEFLOOR_HOSTED_PEPPER first}
      # TRADEFLOOR_HOSTED_PLANS: /config/plans.json
    volumes:
      - tradefloor-data:/data
      # - ./plans.example.json:/config/plans.json:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  tradefloor-data: {}
