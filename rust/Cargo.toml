[package]
name = "pretium"
version = "0.0.0"
edition = "2021"
description = "Deterministic market simulation with a real limit order book. Placeholder release; under active development."
license = "Apache-2.0"
keywords = ["simulation", "finance", "market", "orderbook", "deterministic"]
categories = ["simulation", "science"]
readme = "README.md"

[lib]
name = "pretium"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py311: one wheel per platform covers CPython 3.11 and every later
# version, so the release matrix is five wheels forever rather than five per
# Python version. The floor is 3.11 rather than WP7's original "3.9+" sketch,
# which is stale -- 3.9 is past EOL and SPEC 0 has already dropped 3.10.
pyo3 = { version = "0.22", features = ["abi3-py311", "extension-module"] }

# SPIKE ONLY -- a cross-repo relative path dependency.
#
# This is not a shippable arrangement: a published crate cannot carry a path
# dependency, and this one reaches outside its own repository. It is here to
# prove the PyO3/maturin toolchain end to end while the source-layout question
# is still open (see the WP7 notes). Whatever that decision is -- vendoring a
# scrubbed copy, moving the core, or a git dependency -- it replaces this line.
mc-engine-core = { path = "../../mc-port/crates/mc-engine-core" }

# ============================================================================
# Contractual, not tunable. Nothing here may trade accuracy for speed:
# float reassociation or FMA contraction would silently produce a different
# market on a different CPU, which is the exact failure `mul_add` is banned
# for. No `-C target-cpu=native` in release builds -- wheels compile against
# baseline target features.
#
# WARNING: Cargo honours `[profile.*]` only from the ROOT manifest. This crate
# is its own root today, so this applies. If it ever becomes a workspace
# member, this section moves to the workspace root or it silently stops
# applying.
# ============================================================================
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
