# Example experimental assumptions. This scenario is not a forecast, and not
# a claim about how a real market would respond to a real rate rise.
#
# The canonical rate-shock experiment, written as interventions. The Python
# constructor `Scenario.rate_shock()` is unchanged and still ships: it pins a
# 30-day RAMP across the whole curve for the entire run. This states the same
# experiment in the intervention idiom: the policy rate held 200 basis points
# above whatever the endogenous chain has reached by day 50, and the 10-year
# and the corporate yield moved up with it on the day.
#
# The policy rate is held (`permanent`); the 10-year and the corporate yield
# are impulses. The 10-year closes 5% of its gap to the policy rate plus a
# term premium every session, so with the policy rate held it stays up on its
# own and keeps its daily noise, and the corporate yield moves with the
# 10-year every session (`corporate_yield_daily`) and is re-anchored to it at
# each meeting. Until r13 this file held the corporate yield's LEVEL for the
# rest of the run, which froze it: its daily sd read 0.00 bp against 4.57
# for the unshocked world, and the corporate index stopped moving. The
# 10-year is written before the corporate yield because the corporate index
# re-marks its spread over the 10-year when the corporate yield is written.
#
# `macro_pins_hold` (off on pt-v20 as shipped) holds the policy rate through
# each close and each meeting; without it the close's meeting can move the
# rate and the next morning's pin writes it back.
#
# For the simulated rate indices this is NOT a parallel curve shift, because
# the 2-year is not written; for the whole curve on one day, which is the
# usual stress for a bond book, use curve_shock.yml. Measured on
# `Universe.random(20, seed=101, bonds=True)`, median of seeds 3/11/29, each
# against the same seed without the shock, on pt-v20 (r13, 2026-09-26): on
# day 50 IGCORP returns -12.01% and UST10Y -15.39%; the 2-year, which has its
# own process and closes 5% of its gap to the formula each session, moves
# -0.19% on day 51 and reaches -3.20% by day 120. By day 120 IGCORP stands
# -11.24%, UST10Y -14.48% and the median equity -7.15% below the unshocked
# world, and the corporate yield's daily sd (days 55-120) is 4.59 bp against
# the twin's 4.57. With macro_pins_hold and pinned_vix_feedback on the same
# figures are -12.01, -15.39, -0.19, -3.21, -11.26, -14.55, -7.29 and 4.59.

version: 1

scenario:
  name: rate_shock

  description: >
    A sustained 200 basis point tightening: the policy rate held 200 basis
    points higher from day 50, with the 10-year and the corporate yield
    moved up with it on the day and carried by the chain from there.
    Example experimental assumptions, not a forecast.

  shocks:

    - target: macro.policy_rate
      operation: add
      value: 0.02
      at: 50
      shape: permanent

    - target: macro.treasury_10y
      operation: add
      value: 0.02
      at: 50
      shape: impulse

    - target: macro.corporate_yield
      operation: add
      value: 0.02
      at: 50
      shape: impulse
