# Example experimental assumptions. This scenario is not a forecast, and not
# a claim about how a real market behaves in a real recession.
#
# DATED ON 2007-09 ON THE NBER'S PHASES (0.8.5, r15; the r13
# scenario-frontrun design's candidate I, tools/calibration/
# scenario_candidates/recession_I.yml). Day 50 is December 2007, the NBER
# peak, and a month is 21 sessions.
# - The cycle is held at peak from day 50 and in contraction from day 71 to
#   364, with growth held at -2 per cent through it; trough on day 365;
#   recovery on day 428 (June 2009, the NBER's trough), then the model's own
#   cycle. Under `macro_pins_hold` the held phase holds through every close.
# - Earnings x0.93 by day 249 and x0.70 by day 364, held to day 490
#   (September 2009), back to x0.96 by day 742 and to x1 by day 994.
#   S&P 500 operating earnings, four quarters trailing, fell 57 per cent
#   from 2007Q2 to 2009Q3 and were 0.92 of the 2007 peak over 2010.
# - The VIX follows the real 2008-09 path from day 250 (Lehman, 2008-09-15)
#   to day 427 and is released on day 428 (corrected 2026-10-21, the
#   owner's ruling, after reading: the Cboe VIX over its August 2008 mean,
#   five-session centred means, one model session per real session; the
#   file's earlier leg doubled over twenty sessions, held forty and eased
#   to 0.6 of that by day 428). The path is a multiple of the model's own
#   VIX on day 250: x3.4-3.5 at the October-November 2008 peaks, about
#   x2.3 at the S&P 500's low (day 370, 2009-03-09), x1.48 by day 427.
# - Credit moves on the SPREAD over the 10-year (macro.corporate_spread), so
#   the 10-year's own noise and the policy rate still move the corporate
#   yield: +70 basis points by day 249, +150 by day 289, held to day 364,
#   back to +35 by day 616 and to 0 by day 805, then released. Moody's Baa
#   yield (FRED DBAA) was 35 basis points wider by March 2008, peaked in
#   November 2008, and was back by late 2009.
#
# WHY IT CHANGED. The 0.8.5 file fired everything on day 50: the
# contraction, a corporate LEVEL 150 basis points up and held, and the VIX
# x3 for sixty sessions. The paired index gapped -13.9 per cent (log) on the
# morning of the December 2007 date, a VIX timer (out above 40, back below
# 30) beat holding by +20 to +23 points on 21-22 of 30 seeds, and the held
# corporate level froze the corporate yield (0.00 bp daily sd). With a
# pinned VIX priced when it is published (`pinned_vix_feedback`) the old
# file moved the paired index -43 per cent in one morning. This file dates
# the legs to the NBER's months and puts the VIX leg on Lehman.
#
# MEASURED on the certified roster `Universe.random(40, seed=111)`, its index
# the cap-weighted closes, paired against the same seed with no scenario,
# held-out seeds 201-230 (the grade's own seeds were not used):
# - The thirteenth-registration candidate (box r15scen1: pt-v20 with r13's
#   and r14's dials, pinned_vix_feedback 0.8, pinned_vix_variance_share
#   0.7): the index wins back 57 per cent of its fall in the 252 sessions
#   after its low (row S1a, band 45-100, 2009: 62), rises 69.1 per cent in
#   those sessions (S2, band 25-80, 2009: 69), and every seed is out of
#   contraction within 24 months (S1b). The day-50 morning moves the index
#   -4.5 per cent (log, median) and the next 24 closes -3.9 more. The VIX
#   timer beats holding by +1.7 points (mean; ahead on 4 of 30 seeds, the
#   twin +0.9). The corporate yield's daily sd, days 55-300, is 5.9 bp (the
#   twin 6.2). No close leaves a held phase. The largest one-session paired
#   fall is -4.6 per cent at the median seed and -16.8 on one (seed 205,
#   whose own VIX was 42 on day 250, so the doubling held it at 70-83).
# - pt-v20 as graded (r14 screen, box r14scr1): S1a 0.68, S1b 30 of 30, S2
#   +79.8, 0.2 inside its band; VIX timer +0.7 (ahead 1 of 30); worst paired
#   session -12.2. Without macro_pins_hold the close still rolls a held
#   phase (78 closes over the 30 seeds).

version: 1

scenario:
  name: recession

  description: >
    A downturn with an earnings recession, dated on 2007-09 on the NBER's
    phases. The cycle is held at its peak from day 50 (December 2007), in
    contraction from day 71 to day 364 with growth held at -2 per cent, is
    set to trough on day 365 and to recovery on day 428 (June 2009), and is
    then left to the model's own cycle. Every company's earnings fall to 93
    per cent by day 249 and to 70 by day 364, stay there to September 2009,
    and come back to 96 per cent over the next year and the rest over the
    year after. From day 250 (Lehman) the VIX follows the real 2008-09
    path, as a multiple of its own day-250 level, to day 427, and is
    released on day 428. The credit spread over the 10-year widens 70 basis
    points by day 249 and 150 by day 289, holds to the trough, comes back
    to 35 over a year and to nothing over the next nine months, and is
    released. Example experimental assumptions, not a forecast.

  shocks:

    - target: macro.cycle
      operation: set
      value: 'peak'
      at: 50
      shape: hold
      duration: 21

    - target: macro.cycle
      operation: set
      value: 'contraction'
      at: 71
      shape: hold
      duration: 294

    - target: macro.cycle
      operation: set
      value: 'trough'
      at: 365
      shape: impulse

    - target: macro.cycle
      operation: set
      value: 'recovery'
      at: 428
      shape: impulse

    - target: macro.growth
      operation: set
      value: -0.02
      at: 71
      shape: hold
      duration: 294

    - target: market.earnings
      operation: multiply
      value: 0.93
      at: 50
      shape: ramp
      duration: 200

