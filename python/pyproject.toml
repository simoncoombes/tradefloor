[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pretium"
version = "0.0.0"
description = "Deterministic market simulation with a real limit order book. Placeholder release; under active development."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["simulation", "finance", "market", "orderbook", "deterministic", "backtesting"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pretium"]
