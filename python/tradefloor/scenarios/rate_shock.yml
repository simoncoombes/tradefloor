# Example experimental assumptions. This scenario is not a forecast, and not
# a claim about how a real market would respond to a real rate rise.
#
# The canonical rate-shock experiment, written as interventions. The Python
# constructor `Scenario.rate_shock()` is unchanged and still ships: it pins a
# 30-day RAMP across the whole curve for the entire run. This states the same
# experiment in the intervention idiom -- a step, relative to whatever the
# endogenous chain has reached by day 50, held from there.
#
# Both rates move, and that is the whole point. Equities are discounted off
# the corporate bond yield; the policy rate is a fallback fair value reaches
# only when no corporate yield is present, and inside the engine there always
# is one. Moving the policy rate alone still transmits, but through the
# curve at the central bank's next MEETING rather than on the day.
#
# `permanent` rather than a bare step, and that is not decoration. Measured on
# `Universe.random(20, seed=101)` over 120 days, seeds 3/11/29, shock at day
# 20: a one-shot +200bp write to macro.corporate_yield moved the median
# instrument -0.23%, because the chain recomputes the corporate yield from the
# 10-year at the next central-bank meeting and the write is gone. The same
# shock re-asserted daily moved it -3.50%. A rate shock that is not sustained
# is not a rate shock.
#
# For the simulated rate indices this is NOT a parallel curve shift, because
# neither treasury yield is written. Measured on `Universe.random(20,
# seed=101, bonds=True)`, median of seeds 3/11/29, each against the same seed
# without the shock. On pt-v20, the default from 0.8.5: the corporate index
# reprices on the day (IGCORP -12.01% on day 50); the 2-year, which has its
# own process and closes 5% of its gap to the policy rate each session, moves
# -0.11% on day 51 and reaches -3.29% by day 120; and the 10-year drifts up
# to the new policy rate over the following weeks (UST10Y -14.86% by day
# 120). On pt-v19 the 2-year is rewritten from the policy rate at every
# close, so it moves -3.19% on day 51 and holds there (-3.18% by day 120),
# with IGCORP -12.41% on day 50 and UST10Y -14.77% by day 120. For the whole
# curve on one day, which is the usual stress for a bond book, use
# curve_shock.yml.

version: 1

scenario:
  name: rate_shock

  description: >
    A sustained 200 basis point tightening across the curve, arriving on day
    50 and held for the rest of the run. Example experimental assumptions,
    not a forecast.

  shocks:

    - target: macro.corporate_yield
      operation: add
      value: 0.02
      at: 50
      shape: permanent

    - target: macro.policy_rate
      operation: add
      value: 0.02
      at: 50
      shape: permanent
