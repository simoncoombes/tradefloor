# Example experimental assumptions. This scenario is not a forecast, and not
# a claim about how a real market would respond to a real liquidity event.
#
# Calibrated in 0.8.5 against March 2020 (design repository,
# programme/ptv20-scenario-size.md). The S&P 500 fell 28.8 per cent in the 21
# sessions to 23 March 2020 and 33.9 per cent at worst, with the VIX going
# from 14 to 83.
#
# MEASURED on pt-v20, the certified roster `Universe.random(40, seed=111)`,
# its index the cap-weighted closes, every figure paired against the same
# seed with no scenario, seeds 301-330 (box ptv20g3): the index is -10.0 per
# cent at 21 sessions after the onset, -14.8 at 63, -8.9 at 85 and -4.8 at
# 120, and its worst drawdown within 120 sessions is -33.9 (-10.1 without
# the scenario). The VIX peaks at 76.3 from 17.6. The file before 0.8.5
# moved this index -1.3 per cent at 21 sessions on pt-v19 and -1.5 on
# pt-v20.
#
# WHAT IT CANNOT DO. The model prices a company off its current earnings and
# has no forward-looking valuation, so it cannot fall as fast as March 2020
# did and then look through the earnings dip as that market did. It reaches
# the depth of March 2020 over about three months where the real market took
# one: -10 per cent at 21 sessions against a real -29. A larger earnings cut
# was tried and made the drawdown -55 per cent and too persistent, so this is
# the closest shape found, and a study of a fast crash should not rest on it.
#
# Against the file before 0.8.5: the VIX goes x3.5 rather than x2.0 (March
# 2020 was x5.8, from a calmer start), and earnings fall 15 per cent over two
# months and recover over four. S&P 2020 earnings fell further than that,
# and the market looked through them. The earnings path is this file's
# assumption. Depth and credit are as before.
#
# THE BOOK. `market.liquidity` scales the avg_volume column the market maker
# quotes off, so every ladder level thins, a marketable order walks further
# up it, and the same trade the agent would have made anyway costs more.
# `Universe.random(20, seed=101)`, five seeds, book read after twenty days:
# quoted depth scales exactly with the multiplier, 175,060 shares to 70,019
# at x0.40, and the cost of sweeping 50,000 shares rises from 6.08 bps to
# 8.57 bps, and to 14.59 bps at x0.10. Below x0.4 a 200,000-share order
# cannot be filled from quoted depth at all. The quoted SPREAD does not move
# with depth: spread here is a function of VIX and of the name's size tier,
# not of avg_volume. Those book figures were measured on pt-v16 and describe
# the mechanism, which no preset since has changed.

version: 1

scenario:
  name: liquidity_crisis

  description: >
    A funding event with an earnings shock: quoted depth collapses to 40 per
    cent and the VIX goes three-and-a-half-fold for twenty-five days, credit
    widens 50 basis points, and earnings fall 15 per cent over two months and
    recover over the next four. Volatility is then released back to the
    endogenous chain, and depth is written back, because nothing in the
    engine writes that column. Example experimental assumptions, not a
    forecast.

  shocks:

    - target: market.liquidity
      operation: multiply
      value: 0.40
      at: 50
      duration: 25

    - target: macro.vix
      operation: multiply
      value: 3.5
      at: 50
      duration: 25

    # The earnings shock: down 15 per cent over two months, back over four.
    # The windows are contiguous, because a gap between them restores the
    # pre-shock earnings.
    - target: market.earnings
      operation: multiply
      value: 0.85
      at: 50
      shape: ramp
      duration: 42

    - target: market.earnings
      operation: multiply
      value: 1.1764706
      at: 92
      shape: ramp
      duration: 84

  transmission:

    # An assumption, and one worth stating rather than burying: a funding
    # event that halves depth is assumed to widen credit by 50 basis points
    # as well. Nothing in this simulator derives that number. It is here so
    # the scenario prices a credit channel alongside the execution one, and
    # so that a reader can change it.
    - target: macro.corporate_yield
      operation: add
      value: 0.005
      at: 50
      duration: 25
