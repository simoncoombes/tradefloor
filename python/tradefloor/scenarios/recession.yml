# Example experimental assumptions. This scenario is not a forecast, and not
# a claim about how a real market behaves in a real recession.
#
# Calibrated in 0.8.5 to the depth of 2008 (design repository,
# programme/ptv20-scenario-size.md). The S&P 500 fell 45 per cent over the
# 120 sessions from Lehman to March 2009, with the VIX going from 26 to 81,
# and 57 per cent from the 2007 peak to the March 2009 trough. S&P operating
# earnings fell about 40 per cent in 2008-09.
#
# MEASURED on pt-v20, the certified roster `Universe.random(40, seed=111)`,
# its index the cap-weighted closes, every figure paired against the same
# seed with no scenario, seeds 301-330 (box ptv20g3): the index is -14.5 per
# cent at 21 sessions after the onset, -30.4 at 63, -37.5 at 85 and -44.7 at
# 120, and its worst drawdown within 120 sessions is -48.3 (-10.1 without
# the scenario). The VIX peaks at 70.2 from 17.6, and the corporate yield
# ends 140 basis points wider. On pt-v20 the preset's own earnings cycle
# pulls earnings down in a contraction as well, and the two stack.
#
# WHAT IT CANNOT DO. The model prices a company off its current earnings and
# has no forward-looking valuation, so it falls as earnings fall and not
# ahead of them. It reaches 2008's depth over months. It cannot fall as fast
# as March 2020, 29 per cent in 21 sessions, and it cannot look through an
# earnings dip that a real market expects to reverse.
#
# Against the file before 0.8.5, which moved this index -5.8 per cent at 120
# sessions on pt-v19 and -28.7 on pt-v20: growth is held at a level of -2 per
# cent rather than shifted three points, because a shift refused seeds whose
# growth was already near the floor; the VIX goes x3.0 rather than x1.5
# (2008-09 was x3.2); and every company's earnings fall 40 per cent over four
# quarters, stay down two quarters and recover over four. The earnings path
# is this file's assumption, set to the 2008-09 operating-earnings fall.

version: 1

scenario:
  name: recession

  description: >
    A downturn with an earnings recession, calibrated to 2008's depth: the
    cycle turns to contraction on day 50, growth is held at -2 per cent, the
    VIX triples for sixty days, credit widens 150 basis points, and every
    company's earnings fall 40 per cent over four quarters, stay there two,
    and recover over four. Example experimental assumptions, not a forecast.

  shocks:

    - target: macro.cycle
      operation: set
      value: contraction
      at: 50
      shape: permanent

    - target: macro.growth
      operation: set
      value: -0.02
      at: 50
      shape: permanent

    # The earnings recession: down 40 per cent over four quarters, held two,
    # back over four. The windows are contiguous, because a gap between them
    # restores the pre-shock earnings.
    - target: market.earnings
      operation: multiply
      value: 0.60
      at: 50
      shape: ramp
      duration: 252

    - target: market.earnings
      operation: multiply
      value: 1.0
      at: 302
      shape: hold
      duration: 126

    - target: market.earnings
      operation: multiply
      value: 1.6666667
      at: 428
      shape: ramp
      duration: 252

  transmission:

    # Assumed risk response: three times the volatility, for sixty days.
    - target: macro.vix
      operation: multiply
      value: 3.0
      at: 50
      duration: 60

    # Assumed credit response: 150 basis points wider, held. Nothing in the
    # engine derives this number from the growth path.
    - target: macro.corporate_yield
      operation: add
      value: 0.015
      at: 50
      shape: permanent
