# Example experimental assumptions. This scenario is not a forecast, and not
# a claim about how a real market behaves in a real recession.
#
# Calibrated in 0.8.5 to the depth of 2008 (tradefloor-design,
# programme/ptv20-scenario-size.md). The S&P 500 fell 45 per cent over the
# 120 sessions from Lehman to March 2009, with the VIX going from 26 to 81,
# and 57 per cent from the 2007 peak to the March 2009 trough.
#
# DATED ON 2007-09. Day 50 is December 2007, the NBER peak, and a month is
# 21 sessions.
# - The cycle is held in contraction for 315 sessions, to March 2009 and the
#   S&P 500's low. On day 365 it is set to trough and left to the model's
#   own cycle, which moves to recovery on its own hazards: on days 365 to
#   433 over seeds 301-330, about 30 sessions later on average. The NBER
#   dates the trough June 2009, day 428.
# - Growth is held at -2 per cent through the contraction, then released.
# - Earnings. On pt-v20 the preset's own earnings cycle already takes about
#   30 per cent off every company's earnings in a contraction and gives it
#   back in the recovery, at a 60-session half-life. This file's own cut
#   stacks on it. Together they fall about 54 per cent by day 301, where
#   S&P 500 operating earnings (four quarters trailing) fell 57 per cent,
#   from $91.47 in Q2 2007 to $39.61 in Q3 2009. They stay down to day 427,
#   then the file gives back a fifth of its cut's level over four quarters
#   and the rest over the next four. With the cycle's own recovery, earnings
#   are then about 78 per cent of their pre-shock level a year after day 428
#   and all of it two years after. Operating earnings were about $84 in 2010
#   (92 per cent of the peak) and about $96 in 2011, past it.
# - Credit is 150 basis points wider for the 18 months of the NBER
#   contraction. It then comes back to its day-50 level over a year, and
#   eases 110 basis points more over the next 18 months, then is released
#   to the model's own chain on day 1058. Moody's Baa yield (FRED DBAA) was
#   6.65 per cent in December 2007, peaked at 9.2 in November 2008, was
#   back at 6.3 by September 2009, and was 5.25 by December 2011. The fall
#   back is slower here than in 2009, when it took three months: a fall
#   that fast makes the rebound too strong (below).
#
# THE FIRST 120 SESSIONS ARE AS RECORDED IN 0.8.5. The earnings cut
# follows the 0.8.5 path, x0.60 over 252 sessions, for its first 121
# sessions (to within a rounding of the last bit) and then flattens to x0.65
# by day 301. So these figures stand: MEASURED on pt-v20, the certified
# roster `Universe.random(40, seed=111)`, its index the cap-weighted closes,
# every figure paired against the same seed with no scenario, seeds 301-330
# (box ptv20g3), the index is -14.5 per cent at 21 sessions after the onset,
# -30.4 at 63, -37.5 at 85 and -44.7 at 120. Its worst drawdown within 120
# sessions is -48.3 (-10.1 without the scenario). The VIX peaks at 70.2
# from 17.6.
#
# THE WHOLE PATH, measured on AWS (box recgrid4), seeds 301-330, 1200
# sessions. The log difference against the unshocked twin, in per cent,
# mean over seeds:
#
#   day                   110   170   300   365   450   599   700   899  1199
#   pt-v20 as shipped     -37   -59   -86   -89   -71   -43   -31   -10    -5
#   leading dials         -41   -57   -79   -75   -62   -41   -32   -10    -7
#
# The paired index is lowest on day 365: -89 log, -59 per cent, as shipped;
# -82 log, -56 per cent, on the leading dials. The index's own drawdown is
# -64 and -61 per cent. When credit is released on day 1058 the chain has
# come back up, so the yield rises about 60 basis points and the index
# dips about a point.
#
# "Leading dials" is pt-v20 with earnings_anticipation_half_life 126,
# rate_pe_sensitivity 3 and buyback_payout_share 0.75. These values lead for
# the next preset and are set in none yet.
# - Recession recovers. Against its twin, the index gains back 51 per cent
#   (as shipped) and 48 (leading dials) of its log fall in the 252 sessions
#   after its lowest point. After the March 2009 low the S&P 500 gained back
#   62 per cent (2002-03 43, 1990-91 114, 2020-21 135). The cycle is out
#   of contraction and trough within 24 months on every seed.
# - Rise from the low. The index itself rises 77 per cent (as shipped) and
#   69 (leading dials) in the 252 sessions after its own low. The S&P 500
#   rose 69 per cent from March 2009 (2020-21 75, 2002-03 34, 1990-91 29).
# - Both are inside their bands (45 to 100 per cent, and 25 to 80) on both
#   dial sets, but only just: the tightest margins are 3 points, against
#   standard errors of 2 to 6 over 30 seeds. About 20 points of the rise is
#   the twin's own rise over the same year: the index's own low tends to
#   fall where the shared market noise is low, and the model reverts from
#   there. A faster earnings or credit recovery fails the rise; a slower
#   one fails the recovery.
# - Before this change the file held contraction, growth and credit for good.
#   The index never recovered: it was -58 to -66 per cent (log) against its
#   twin 550 sessions after the onset, and it gained back 40 per cent of its
#   fall within a year.
# All of these figures get re-measured once the next preset's dials are
# final.
#
# WHAT IT CANNOT DO. On pt-v20 as shipped the model prices a company off its
# current earnings and has no forward-looking valuation. So it falls as
# earnings fall and not ahead of them, and it reaches 2008's depth over
# months. It cannot fall as fast as March 2020, 29 per cent in 21 sessions,
# and it cannot look through an earnings dip that a real market expects to
# reverse. With earnings_anticipation_half_life set, a turn of the cycle
# moves prices at once, so the index turns up with the trough on day 365.
#
# Against the file before 0.8.5, which moved this index -5.8 per cent at 120
# sessions on pt-v19 and -28.7 on pt-v20: growth is held at a level of -2 per
# cent rather than shifted three points, because a shift refused seeds whose
# growth was already near the floor; the VIX goes x3.0 rather than x1.5
# (2008-09 was x3.2); and every company's earnings are cut and restored as
# above. The earnings path is this file's assumption.

version: 1

scenario:
  name: recession

  description: >
    A downturn with an earnings recession, dated on 2007-09. The cycle
    turns to contraction on day 50 and is held there fifteen months. On day
    365 it is set to trough and left to the model's own cycle, which moves
    on to recovery. Growth is held at -2 per cent through the contraction,
    and the VIX triples for sixty days. Credit is 150 basis points wider for
    eighteen months, then eases back over the next thirty. Every company's
    earnings fall 35 per cent over four quarters, on top of the preset's
    own cycle, stay there two, and recover over eight. Example experimental
    assumptions, not a forecast.

  shocks:

    # The cycle: contraction for 315 sessions, then a trough the model's own
    # hazards carry on from. A `hold` on the phase writes it every day and
    # stops; the cycle then runs from whatever phase was written last.
    - target: macro.cycle
      operation: set
      value: contraction
      at: 50
      shape: hold
      duration: 315

    - target: macro.cycle
      operation: set
      value: trough
      at: 365
      shape: impulse

    - target: macro.growth
      operation: set
      value: -0.02
      at: 50
      shape: hold
      duration: 315

    # The earnings recession. Down to x0.65 by day 301: first along the
    # 0.8.5 path (x0.60 over 252 sessions) for 121 sessions, then flatter.
    # Held to day 427. Back to x0.78 over four quarters and to x1 over the
    # next four. The windows are contiguous, because a gap between them
    # restores the pre-shock earnings.
    - target: market.earnings
      operation: multiply
      value: 0.807936507936508
      at: 50
      shape: ramp
      duration: 121

    - target: market.earnings
      operation: multiply
      value: 0.8045186640471513
      at: 171
      shape: ramp
      duration: 131

    - target: market.earnings
      operation: multiply
      value: 1.0
      at: 302
      shape: hold
      duration: 126

    - target: market.earnings
      operation: multiply
      value: 1.2
      at: 428
      shape: ramp
      duration: 252

    - target: market.earnings
      operation: multiply
      value: 1.2820512820512822
      at: 680
      shape: ramp
      duration: 252

  transmission:

    # Assumed risk response: three times the volatility, for sixty days.
    - target: macro.vix
      operation: multiply
      value: 3.0
      at: 50
      duration: 60

    # Assumed credit response: 150 basis points wider for the 18 months of
    # the NBER contraction, back to the day-50 level over a year, 110 basis
    # points under it over the next 18 months, then released. Nothing in the
    # engine derives these numbers from the growth path.
    - target: macro.corporate_yield
      operation: add
      value: 0.015
      at: 50
      shape: hold
      duration: 378

    - target: macro.corporate_yield
      operation: add
      value: -0.015
      at: 428
      shape: ramp
      duration: 252

    - target: macro.corporate_yield
      operation: add
      value: -0.011
      at: 680
      shape: ramp
      duration: 378
