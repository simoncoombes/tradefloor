# Dependency updates, weekly and grouped.
#
# Grouped on purpose: this project pins a Rust toolchain, a PyO3 version and
# five wheel targets, and a stream of single-dependency pull requests against
# a determinism gate that runs five builds is a lot of compute for very little
# signal. One pull request per ecosystem per week is reviewable.
#
# Every block below targets `dev`. Dependabot opens against the DEFAULT branch
# unless told otherwise, so without this a dependency bump arrives on `main`,
# which this project keeps clear between releases. One did, on 2026-08-30,
# before this line existed.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      actions:
        patterns: ["*"]
    # suite.yml's MSRV job pins `dtolnay/rust-toolchain@1.83`: the ref names
    # the toolchain, 1.83 is the crate's declared rust-version, and the job
    # exists to build on exactly that. The group once rewrote it to @1.120
    # (#266, closed), which would have tested a toolchain the crate does not
    # promise. The other uses of this action are @stable, which Dependabot
    # does not move.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
