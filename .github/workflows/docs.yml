# The learning-path documentation gate.
#
# `docs/` is generated and committed, which is what lets GitHub Pages
# serve it without a build step. The cost of committing generated output is
# that it can fall behind its source silently: someone edits a design file,
# or a golden moves under the charts, and the site on disk still says what it
# said before. Three checks close that.
#
# The build is cheap -- Python and node, no crate, no wheel -- and the browser
# pass adds about a minute. Nothing here needs rationing.

name: docs

on:
  push:
    paths:
      - 'docs/**'
      - 'tools/docs/**'
      - 'rust/goldens/**'
      - 'examples/data/**'
      - '.github/workflows/docs.yml'
  # No path filter, unlike the push trigger above. `build` is a REQUIRED check
  # on main, and a required check that never runs blocks the merge rather than
  # passing it, so it has to report on every pull request even one that
  # touches no documentation.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, not a shallow clone. The sitemap's lastmod and the
      # datePublished on every page come from when each page's source was
      # last committed, so a checkout with one commit in it builds a
      # different site and the staleness check fails on all twenty-five.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The charts are generated from the goldens. If a golden moved, this
      # says so before anyone looks at a picture that is quietly wrong.
      - name: The chart data still matches its sources
        run: python tools/docs/learn/data.py --check

      # Rebuild into a temporary directory and diff. A difference means the
      # committed site is stale, and the message says which file.
      - name: The committed site is what the sources build
        run: python tools/docs/learn/build.py --check

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome

      # Every page, in a real browser: no exception, no console error, no
      # failed request, no unresolved binding, and the built markup and the
      # mounted markup agree.
      - name: Every page loads and works
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/docs/learn/verify.cjs docs

      # 360, 414, 620 and 900 CSS pixels. A page that scrolls sideways on a
      # phone fails here rather than on someone's phone.
      - name: No page scrolls sideways
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/docs/learn/verify.cjs docs --responsive
