# The whole test suite, on a schedule.
#
# `determinism.yml` is what a pull request gates on: five wheel targets, the
# known-answer digest, and the reproducibility chain. That is about four
# minutes and it is deliberately narrow -- it covers what can move a market
# and what a wheel is allowed to contain.
#
# The other ~1,240 tests ran nowhere automatic. They take over half an hour in
# one process, which is why they were never put in front of a pull request,
# and "too slow for a PR" quietly became "runs on nobody's machine but the
# author's". Split four ways they finish in about ten minutes, which is fine
# for a nightly.
#
# Nightly rather than weekly because the runners are free on a public
# repository and the value is finding a regression next to the change that
# caused it, not seven changes later.
name: suite

on:
  # A pull request as well as the schedule, since 0.6.x. The header above
  # reasoned that half an hour was too slow to gate a merge, and it was; split
  # four ways it is about ten minutes, which is not. Nightly alone let two
  # merges land broken and be found later: one carried four Rust test files
  # that did not compile, and one a markdown change that failed a prose test
  # nothing ran. Both were invisible to `determinism.yml`, which gates on what
  # can move a market and correctly says nothing about either.
  pull_request:
    branches: [main, dev]
  # And on the merge itself. A pull request is tested against the base it
  # was opened on, so two that each pass can still break the branch when
  # both land; this run is the one that sees the result.
  push:
    branches: [main, dev]
  schedule:
    # 04:17 UTC. Off the hour on purpose: GitHub's scheduler queues the top of
    # every hour heavily and a job asking for 04:00 can wait twenty minutes for
    # a runner it did not need to wait for.
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  wheel:
    name: build the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        run: |
          # Once, and shared. Four batches building their own wheel would
          # spend four compiles to test one artefact, and could in principle
          # test four different ones.
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: suite-wheel
          path: dist/*.whl

  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # `cargo test`, and not only `cargo build`: the failure this exists for
      # was integration tests that stopped COMPILING when a struct gained a
      # field, which a library build never sees. Until 0.6.x this ran only in
      # `release.yml`, in the job that publishes the crate, which runs beside
      # the job that publishes the wheels. A Rust test failure could therefore
      # arrive after the wheels were already on PyPI, which is the one step
      # that cannot be undone.
      #
      # The goldens are committed, so the parity suites run here in full
      # rather than skipping the way they do against the packaged crate.
      - name: The crate passes its own tests
        working-directory: rust
        run: cargo test --release
      # The browser binding's tests build a `Sim` natively and run it, which
      # needs the `wasm` feature that the plain run above leaves off.
      - name: The browser binding's own tests
        working-directory: rust
        run: cargo test --release --features wasm --lib wasm::
      # Every target and every feature, warnings as errors. Plain
      # `cargo clippy` failed outright on 0.8.5 (a spelled-out sqrt(2) trips
      # `approx_constant`, which clippy denies by default) and `-D warnings`
      # found 26 more on the library, because nothing ran it. The allows that
      # remain in the source each say why at the site.
      - name: Clippy is clean
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      # The crate docs as docs.rs builds them (with `wasm`), warnings as
      # errors. 0.8.5 shipped 24 rustdoc warnings, all broken or private
      # intra-doc links, which render as plain text or dead links on docs.rs.
      # The README example is the crate root's doctest, so `cargo test`
      # above runs it.
      - name: The docs build without warnings
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features wasm

  msrv:
    name: cargo check on the declared rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain here and `rust-version` in rust/Cargo.toml are one
      # number, and tests/test_rust_crate.py fails if they drift apart.
      # 1.83 is a real floor, not a guess: `f64::from_bits` in a const
      # (S_PHI_TICK, MISPRICING_PHI) became stable in 1.83, and 1.82 stops
      # there with "not yet stable as a const fn".
      - uses: dtolnay/rust-toolchain@1.83
      - name: Every target and feature builds on the oldest supported Rust
        working-directory: rust
        # No --locked: Cargo.lock is not committed (this is a library crate,
        # and .gitignore lists it), so --locked has no lock file to hold the
        # build to and stops at once. This resolves fresh, as a user's build
        # does.
        run: cargo check --all-targets --all-features

  batch:
    name: tests ${{ matrix.batch }} on ${{ matrix.interpreter }}
    needs: wheel
    runs-on: ubuntu-latest
    strategy:
      # A failure in one batch must not cancel the others: the useful output
      # of a nightly is the whole picture, not the first thing to break.
      fail-fast: false
      matrix:
        batch: [a-e, f-p, q-z, facts]
        # The floor and the newest supported version. The builtin sum() over
        # floats compensates from 3.12, and two exact-equality tests failed by
        # one ulp on 3.13 for releases while every job here ran 3.11. The
        # batches run in parallel, so the second version costs runner time,
        # not wall time.
        interpreter: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.interpreter }}
      - uses: actions/download-artifact@v8
        with:
          name: suite-wheel
          path: dist
      - name: Install the wheel and everything the optional lanes need
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          # --no-index so the package under test is the one just built and
          # never a resolution from PyPI.
          python -m pip install --no-index --find-links dist tradefloor
          # By name, so the extras' own dependencies can resolve. Every one of
          # these gates an `importorskip`, and a lane that skips is a lane
          # that reports green by not running.
          #
          # The three agent frameworks are that same rule applied to the
          # adapters under `python/tradefloor/integrations/`. Two of them are
          # imported under a different name than they are installed under:
          # `openai-agents` imports as `agents`, `pydantic-ai-slim` as
          # `pydantic_ai`. Slim rather than the umbrella `pydantic-ai`,
          # because slim is what the extra in pyproject.toml installs and a
          # lane that tests a different distribution from the one a user gets
          # is testing the wrong package.
          #
          # `finrobot` is deliberately not here. Its tree is an order of
          # magnitude heavier than the rest of this line put together
          # (`pyautogen[retrievechat]` pulls a whole RAG stack), it needs
          # `anthropic<1.0` and would drag this job's `anthropic` back with
          # it, and the FinRobot tests are written to pass WITHOUT it: they
          # replay a recorded run, and
          # `test_live_mode_without_finrobot_names_the_extra` can only run
          # when the package is absent. Installing it here would cost minutes
          # and turn a test off.
          python -m pip install pyarrow numpy gymnasium mcp anthropic pydantic \
                                openai-agents pydantic-ai-slim langgraph pyyaml
          # `openai` by name as well: two PydanticAI tests build a real
          # OpenAI model and skip without the SDK, which pydantic-ai-slim
          # does not install. openai-agents brings it.
          # pyyaml for the tests that read the workflows and for
          # test_yaml_subset.py's cross-check, which skips without it.
          python -c "import pyarrow, numpy, gymnasium, mcp, agents, openai, pydantic_ai, langgraph, yaml; print('optional surfaces present')"
      - name: Run
        shell: bash
        run: |
          cd "${{ github.workspace }}"
          # The batch definition lives in one place, and
          # tests/test_packaging.py asserts it covers every file. A test file
          # in no batch would run nowhere and nothing would say so.
          FILES=$(python tools/ci/batches.py "${{ matrix.batch }}")
          echo "batch ${{ matrix.batch }}: $FILES"
          python -m pytest -q -rf $FILES

  versions:
    name: python ${{ matrix.python }}
    needs: wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two nobody runs. The wheel is abi3-py311, the gate builds and
        # tests on 3.11, and development happens on the newest release, so the
        # floor and the ceiling are covered and the middle is covered by
        # neither. One wheel serves all of them, so this is a few seconds to
        # find out that it does.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: suite-wheel
          path: dist
      - name: Install and check the guarantees hold
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest pyarrow
          python -m pip install --no-index --find-links dist tradefloor
          cd "${{ runner.temp }}"
          python -c "import tradefloor as tf; print('import ok on', tf.__version__)"
          cd "${{ github.workspace }}"
          # test_python_versions.py compares an agent-driven run with
          # digests taken on 3.11. The other four each run inside one
          # interpreter and could not see a difference between two: 0.8.5
          # shipped with the random baseline's orders differing between
          # 3.11 and 3.12 in the last bits (built-in sum() over floats
          # changed in 3.12) and this job stayed green.
          python -m pytest -q \
            tests/test_forking.py \
            tests/test_checkpoint.py \
            tests/test_replay.py \
            tests/test_packaging.py \
            tests/test_python_versions.py

  examples:
    name: the examples execute
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: suite-wheel
          path: dist
      - name: Install the wheel, a kernel and what the notebooks import
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist tradefloor
          # nbformat and nbclient execute the notebooks and ipykernel is the
          # kernel they run on. matplotlib, pyarrow and numpy are what the
          # notebooks import, gymnasium is 05-training-an-agent's, and
          # anthropic and pydantic are what the tests of 08-claude-agent.py
          # load it with (a stand-in client, no key and no bill).
          python -m pip install nbformat nbclient ipykernel matplotlib \
                                pyarrow numpy gymnasium anthropic pydantic
          python -c "import nbformat, nbclient, ipykernel, matplotlib, pyarrow, numpy, gymnasium, anthropic, pydantic; print('notebook stack present')"
      - name: Execute every notebook and example, and the README's commands
        shell: bash
        env:
          TRADEFLOOR_SLOW_TESTS: "1"
        run: |
          # The batch job runs these files too, but without the flag, so
          # there every notebook execution skips and the job is green having
          # executed none. That was the only place they ran in CI.
          python -m pytest -q -rs tests/test_examples.py \
            tests/test_readme_snippets.py --junitxml=examples.xml
      - name: Nothing skipped
        shell: bash
        run: |
          # pytest exits 0 over a skip, and a notebook test skips when
          # nbclient is missing or the flag is unset. A skip here is a
          # notebook that did not run, so it fails the job.
          python tools/ci/no_skips.py examples.xml

  install:
    name: a clean install runs
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: suite-wheel
          path: dist
      - name: Install into an empty venv and use it as a reader would
        shell: bash
        run: |
          set -euo pipefail
          # A venv with nothing in it but the wheel: the package declares no
          # dependencies, so anything it needs and does not declare fails
          # here and nowhere else in CI, where every job installs extras.
          python -m venv "${{ runner.temp }}/clean"
          PY="${{ runner.temp }}/clean/bin/python"
          "$PY" -m pip install --no-index --find-links dist tradefloor
          want="tradefloor $(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          # Outside the checkout, so nothing can import the source tree.
          cd "${{ runner.temp }}"
          export PATH="${{ runner.temp }}/clean/bin:$PATH"
          test "$(tradefloor --version)" = "$want"
          test "$("$PY" -m tradefloor --version)" = "$want"
          tradefloor scenario list > /dev/null
          tradefloor scenario validate recession
          tradefloor mcp --help > /dev/null
          "$PY" - <<'PY'
          import struct
          import tradefloor as tf

          def run():
              e = tf.Engine(universe=tf.Universe.random(5, seed=1), seed=2)
              e.run_days(2)
              raw = e.prices()
              return struct.unpack(f"<{len(raw) // 8}d", raw), e.state_hash()

          (prices, digest), again = run(), run()
          assert len(prices) == 5 and all(p > 0 for p in prices), prices
          assert again[1] == digest, "the same seed gave two markets"
          print("two days on", tf.version(), tf.model_preset()["name"], digest[:16])
          PY

  known-answers:
    name: a moved known answer carries a bump and a note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and its tags: the check compares each
          # known-answer file with the newest release tag, and a shallow
          # clone has none, which it reports as a failure.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compare with the newest release
        shell: bash
        run: |
          # test_known_answer.py fails when a digest moves and the JSON was
          # not re-based. This fails when it was re-based and the version
          # or the note was left as the release had it, which the other
          # cannot see. tools/ci/kat_history.py gives the rules per file.
          python tools/ci/kat_history.py

  complete:
    name: the suite is green
    needs: [batch, versions, rust, msrv, examples, install, known-answers]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        shell: bash
        run: |
          # `needs` already fails this job if any batch failed. The step exists
          # so there is one name to look at, and one name to require. It is a
          # gate as of 0.6.x, so making `the suite is green` a required check
          # on main and dev is what actually closes the hole; the trigger
          # above only makes it run.
          echo "every batch, every python version, the crate, the examples, a clean"
          echo "install and the known-answer history passed"
