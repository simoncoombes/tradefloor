# Example experimental assumptions. This scenario is not a forecast, and not
# a claim about how a real market would respond to a real rate rise.
#
# A parallel shift: the whole curve 200 basis points higher on day 50. The
# policy rate, the 2-year and 10-year treasury yields and the corporate yield
# all move together, which is the standard rate-shock stress for a bond
# book, and it is what the simulated rate indices (UST2Y, UST10Y, IGCORP)
# are priced off. rate_shock.yml writes the 2-year's inputs and not the
# 2-year, so its 2-year arrives over weeks, through the chain; this one lands
# on the day.
#
# The treasury and corporate writes are impulses, not holds. The 10-year
# closes 5% of its gap to the policy rate plus a term premium every session,
# the 2-year closes 5% of its gap to its formula, and the corporate yield
# moves with the 10-year every session (`corporate_yield_daily`) and is
# re-anchored to it at each meeting, so with the policy rate held 200bp
# higher all three stay there on their own and keep their daily noise. A
# permanent write freezes a field at its day-50 level for the rest of the
# run: until r13 the corporate yield was held that way, and its daily sd read
# 0.00 bp against 4.57 for the unshocked world. Only the policy rate is held,
# because a meeting would otherwise re-set it; `macro_pins_hold` (off on
# pt-v20 as shipped) holds it through the meeting as well.
#
# Measured on `Universe.random(20, seed=101, bonds=True)` over 120 days,
# seeds 3/11/29, against the same world with no scenario, on pt-v20 (r13,
# 2026-09-26): on day 50 UST2Y returned -3.71%, UST10Y -15.39% and IGCORP
# -12.01% (the formula alone gives -3.71%, -15.32% and -12.00% for a clean
# 200bp move). By day 120 they stood -3.16%, -14.48% and -11.24% below the
# unshocked world, the median equity -7.15%, and the corporate yield's
# daily sd (days 55-120) was 4.59 bp against the twin's 4.57. With
# macro_pins_hold and pinned_vix_feedback on: -3.71, -15.39, -12.01 on the
# day and -3.16, -14.55, -11.26 and -7.29 by day 120.

version: 1

scenario:
  name: curve_shock

  description: >
    A parallel 200 basis point rise across the whole curve on day 50: the
    policy rate, the 2-year and 10-year treasury yields and the corporate
    yield move together and stay up. Example experimental assumptions, not
    a forecast.

  shocks:

    - target: macro.policy_rate
      operation: add
      value: 0.02
      at: 50
      shape: permanent

    - target: macro.treasury_2y
      operation: add
      value: 0.02
      at: 50
      shape: impulse

    - target: macro.treasury_10y
      operation: add
      value: 0.02
      at: 50
      shape: impulse

    - target: macro.corporate_yield
      operation: add
      value: 0.02
      at: 50
      shape: impulse
