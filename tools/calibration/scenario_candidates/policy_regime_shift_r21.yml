# Example experimental assumptions. This scenario is not a forecast, and not
# a claim about how a real market responds to a real change of government.
#
# There is no candidate here, no party and no election, and there will not
# be. A scenario named after a person is a political forecast wearing a
# simulator's clothes, and this library has nothing to say about who wins an
# election. What it can do is run a market under an explicitly stated policy
# assumption, so that the assumption is the thing being argued about.
#
# So the political event is abstracted into the economics: a tariff rate that
# moves, and an assumed response in prices and credit. Anyone who wants to
# map a narrative onto this file can, and the mapping stays theirs.
#
# The tariff channel is real and small. `policy.tariff_rate` is the one
# target here nothing moves endogenously, so a change to it is permanent by
# construction, and it adds (rate - 5pp) * 0.01 to the monthly inflation
# step. Measured on `Universe.random(20, seed=101)` over 120 days, seeds
# 3/11/29: +8 percentage points of tariff moved the median instrument 0.00%
# (worst -0.25%, best +0.37%) -- indistinguishable from noise at three seeds.
# The transmission block below is therefore where this scenario's content
# actually lives, which is exactly why it is written down separately.
#
# CREDIT AS A SPREAD (r13). The credit response is written on
# `macro.corporate_spread`, the corporate yield's spread over the 10-year,
# rather than on the yield's level. A permanent write to the level froze the
# corporate yield at one value for the rest of the run (daily sd 0.00 bp).
# As a spread it reads 4.0 bp over the 245 sessions from day 35 against 5.1
# for the unshocked world (medians, certified roster
# `Universe.random(40, seed=111).with_bonds()`, pt-v20, desk seeds 201-212,
# the same with `macro_pins_hold` and `pinned_vix_feedback` on).

version: 1

scenario:
  name: policy_regime_shift

  description: >
    A change in trade and monetary policy: tariffs eight percentage points
    higher from day 40, with an assumed inflation and credit response.
    Example experimental assumptions about policy, not about any election,
    party or person.

  shocks:

    - target: policy.tariff_rate
      operation: add
      value: 0.08
      at: 40
      shape: permanent

  transmission:

    # Assumed pass-through of tariffs into consumer prices: 40 basis points,
    # held. The engine's own tariff-to-inflation channel is roughly a third
    # of this and arrives monthly; the difference is the assumption.
    - target: macro.inflation
      operation: add
      value: 0.004
      at: 50
      shape: permanent

    # Assumed policy-uncertainty repricing, arriving before the tariff does
    # because markets price a regime change when it becomes likely rather
    # than when it takes effect. Written as the spread over the 10-year, so
    # the corporate yield keeps the curve's moves; a held level froze it.
    - target: macro.corporate_spread
      operation: add
      value: 0.005
      at: 30
      shape: permanent
