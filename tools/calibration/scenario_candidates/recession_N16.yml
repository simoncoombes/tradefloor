# A CANDIDATE for python/tradefloor/scenarios/recession.yml, NOT packaged
# (r13 scenario-frontrun, thirteenth registration candidate). Load it with
# `tf.Scenario.from_yaml(path)`.
#
# Why the packaged file cannot stay as it is on the r13 arm: it fires
# everything on day 50 (the contraction pin, whose anticipated earnings take
# about -8 per cent, a corporate LEVEL +150 bp held for 378 sessions, and the
# VIX x3 for 60 sessions). With `pinned_vix_feedback` the VIX is priced the
# morning it is published, and the morning of day 50 moved the paired index
# -43 per cent (log, median, desk seeds 201-212) with S1a 0.410, under its
# band. Real: Baa was 35 bp wider by March 2008, and the Lehman leg began
# about day 250.
#
# The NBER-phased shape: peak held from day 50 (December 2007); contraction
# from day 71 to 364 with growth held at -2 per cent; trough on 365; recovery
# on 428 (June 2009) and the model's own cycle after. Earnings x0.93 by day
# 249 and x0.70 by 364, held, then back to x0.96 and x1. The VIX x2.5 over
# 20 sessions from day 250 (Lehman), held 40, eased to x0.6 by day 428, then
# released. Credit on `macro.corporate_spread`: +70 bp by day 249, +150 by
# 289, held, then back to 0 and released.
#
# N16 (the design's): the spread back 115 bp over 126 sessions from day 365
# and the rest over 189; earnings back over 189 then 252 sessions.
#
# DESK, pt-v20, certified roster `Universe.random(40, seed=111).with_bonds()`,
# paired against the same seed with no scenario, seeds 201-212, 700
# sessions (rows as recession_rows.py defines them; bands S1a 0.45-1.00, S2
# 25-80, S1b all seeds):
#   macro_pins_hold=1, pinned_vix_feedback=1: S1a 0.847, S1b 12/12,
#     S2 +109.2 (FAILS); day-50 morning -4.5, worst one-session fall -8.7
#     (median; -13.6 on the worst seed); no close off the held phase.
#   pt-v20 as shipped: S1a 0.834, S1b 12/12, S2 +92.2 (FAILS); 34 closes off
#     the held phase and 27 one-day troughs over the twelve seeds.
#   macro_pins_hold only: S1a 0.858, S2 +109.6; pinned_vix_feedback only:
#     S1a 0.837, S2 +92.5.
# The design measured S2 +78.6 on seeds 301-304. S2 per seed ran from 45 to
# 215 here, so 12 seeds carry a standard error of about 13.

version: 1

scenario:
  name: recession

  description: >
    Candidate N16: an NBER-phased recession dated on 2007-09. Example experimental assumptions, not a forecast.

  shocks:

    - target: macro.cycle
      operation: set
      value: 'peak'
      at: 50
      shape: hold
      duration: 21

    - target: macro.cycle
      operation: set
      value: 'contraction'
      at: 71
      shape: hold
      duration: 294

    - target: macro.cycle
      operation: set
      value: 'trough'
      at: 365
      shape: impulse

    - target: macro.cycle
      operation: set
      value: 'recovery'
      at: 428
      shape: impulse

    - target: macro.growth
      operation: set
      value: -0.02
      at: 71
      shape: hold
      duration: 294

    - target: market.earnings
      operation: multiply
      value: 0.93
      at: 50
      shape: ramp
      duration: 200

    - target: market.earnings
      operation: multiply
      value: 0.7526881720430106
      at: 250
      shape: ramp
      duration: 115

    - target: market.earnings
      operation: multiply
      value: 1.0
      at: 365
      shape: hold
      duration: 126

    - target: market.earnings
      operation: multiply
      value: 1.3714285714285714
      at: 491
      shape: ramp
      duration: 189

    - target: market.earnings
      operation: multiply
      value: 1.0416666666666667
      at: 680
      shape: ramp
      duration: 252

  transmission:

    - target: macro.vix
      operation: multiply
      value: 2.5
      at: 250
      shape: ramp
      duration: 20

    - target: macro.vix
      operation: multiply
      value: 1.0
      at: 270
      shape: hold
      duration: 40

    - target: macro.vix
      operation: multiply
      value: 0.6
      at: 310
      shape: ramp
      duration: 118

    - target: macro.corporate_spread
      operation: add
      value: 0.007
      at: 50
      shape: ramp
      duration: 200

    - target: macro.corporate_spread
      operation: add
      value: 0.008
      at: 250
      shape: ramp
      duration: 40

    - target: macro.corporate_spread
      operation: add
      value: 0.0
      at: 290
      shape: hold
      duration: 75

    - target: macro.corporate_spread
      operation: add
      value: -0.0115
      at: 365
      shape: ramp
      duration: 126

    - target: macro.corporate_spread
      operation: add
      value: -0.0035
      at: 491
      shape: ramp
      duration: 189

